name: CI

on:
  pull_request:
    branches: [develop, main]
    # `edited` re-runs every check when a PR's base branch changes; otherwise a PR retargeted to main
    # would keep the green pr-policy result from develop, and one retargeted away from main would stay red.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SONAR_ORGANIZATION: adamcharusta
  SONAR_PROJECT_KEY: adamcharusta_PolskiStreamerSimulator

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: source/backend/global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/backend/Directory.Packages.props', 'source/backend/**/*.csproj', 'source/backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore PolskiStreamerSimulator.slnx
      - name: Build
        run: dotnet build PolskiStreamerSimulator.slnx -c Release --no-restore
      # C generates its client from this file; it must match the code. The output path is relative to WebApp.
      - name: Verify OpenAPI document
        run: |
          dotnet run --project WebApp -c Release --no-build -- openapi --document v1 --output openapi/v1.json
          git diff --exit-code -- WebApp/openapi/v1.json
      - name: Verify formatting
        run: dotnet format PolskiStreamerSimulator.slnx --verify-no-changes --no-restore
      - name: Test with coverage gate
        run: >-
          dotnet test PolskiStreamerSimulator.slnx -c Release --no-build
          --filter-not-trait "Category=Integration"
          --results-directory "$RUNNER_TEMP/test-results"
          --coverlet --coverlet-threshold 80 --coverlet-threshold-type line --coverlet-threshold-stat total
      # coverlet.MTP only sets a non-zero exit code when the gate fails, so state the measured value here.
      - name: Coverage summary
        if: always()
        run: |
          report=$(ls "$RUNNER_TEMP"/test-results/coverage.cobertura.*.xml 2>/dev/null | head -n 1)
          if [ -z "$report" ]; then
            echo "Backend coverage report was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rate=$(grep -o 'line-rate="[0-9.]*"' "$report" | head -n 1 | cut -d '"' -f 2)
          percent=$(awk -v r="$rate" 'BEGIN { printf "%.2f", r * 100 }')
          echo "Backend line coverage: ${percent}% (gate: 80%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v r="$rate" 'BEGIN { exit !(r < 0.8) }'; then
            echo "::error::Backend line coverage ${percent}% is below the 80% gate."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/test-results/coverage.cobertura.*.xml
          if-no-files-found: warn

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: source/backend/global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/backend/Directory.Packages.props', 'source/backend/**/*.csproj', 'source/backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore PolskiStreamerSimulator.slnx
      - name: Build
        run: dotnet build PolskiStreamerSimulator.slnx -c Release --no-restore
      # SQL Server runs in Testcontainers; ubuntu-latest has Docker.
      - name: Integration tests
        run: dotnet test PolskiStreamerSimulator.slnx -c Release --no-build --filter-trait "Category=Integration"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/frontend/.nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - name: Install
        run: npm ci
      # The client must match the committed contract; untracked output counts as drift too.
      - name: Verify generated API client
        run: |
          npm run api:generate
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --porcelain -- src/api/generated
            echo "::error::src/api/generated differs from the OpenAPI document. Run npm run api:generate and commit the result."
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test with coverage gate
        run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: source/frontend/coverage/lcov.info
          if-no-files-found: warn

  sonar:
    name: sonar
    # The SonarQube Cloud Free plan analyses only its main branch, `develop` (TD-89), and PRs; pushes to `main` skip the job.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/backend
    steps:
      - name: Require SonarQube Cloud token
        working-directory: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::The SONAR_TOKEN repository secret is not available to this run. Add it as described in docs/development-and-delivery.md (SonarQube Cloud quality gate)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: source/backend/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/frontend/.nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - name: Install frontend
        working-directory: source/frontend
        run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/backend/Directory.Packages.props', 'source/backend/**/*.csproj', 'source/backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore tools
        run: dotnet tool restore
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE"
          /d:sonar.cs.opencover.reportsPaths="$RUNNER_TEMP/sonar-results/coverage.opencover.*.xml"
          /d:sonar.javascript.lcov.reportPaths="$GITHUB_WORKSPACE/source/frontend/coverage/lcov.info"
          /d:sonar.coverage.exclusions="**/Tools/BatchSimulator/Program.cs,**/*.g.cs,**/Persistence/Migrations/**,source/frontend/src/main.tsx,source/frontend/src/api/generated/**"
          /d:sonar.exclusions="**/Tests/Golden/**,**/Persistence/Migrations/**,source/frontend/src/api/generated/**,source/frontend/**/*.test.ts,source/frontend/**/*.test.tsx,source/frontend/test/**,source/frontend/e2e/**,**/node_modules/**,**/coverage/**,**/dist/**"
          /d:sonar.qualitygate.wait=true
      - name: Build
        run: dotnet build PolskiStreamerSimulator.slnx -c Release
      - name: Test with OpenCover coverage
        run: dotnet test PolskiStreamerSimulator.slnx -c Release --no-build --results-directory "$RUNNER_TEMP/sonar-results" --coverlet
      - name: Require OpenCover report
        run: |
          if ! ls "$RUNNER_TEMP"/sonar-results/coverage.opencover.*.xml >/dev/null 2>&1; then
            echo "::error::No OpenCover report in $RUNNER_TEMP/sonar-results; SonarQube Cloud would see 0% coverage."
            exit 1
          fi
      - name: Test frontend with LCOV coverage
        working-directory: source/frontend
        run: npm run test:coverage
      - name: End analysis and wait for the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  pr-policy:
    name: pr-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Self-test the policy script
        run: bash .github/scripts/check-pr-source.test.sh
      - name: Check the PR source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/check-pr-source.sh
