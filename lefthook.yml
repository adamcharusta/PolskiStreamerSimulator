# Git hooks (TD-88). Install once with `npm install` in the repository root.
# A hook that changes tracked files rejects the commit; review and stage the fixes yourself.
pre-commit:
  piped: true
  fail_on_changes: always
  jobs:
    - name: backend-format
      root: "source/backend/"
      glob: "source/backend/**/*.cs"
      # Print the formatter's fix and fail here: with partially staged files Lefthook restores the
      # unstaged hunks afterwards and discards the fix, so the printed diff is what to apply.
      run: dotnet format PolskiStreamerSimulator.slnx --include {staged_files} && git diff --exit-code -- {staged_files}
    # No `root` here: `root` also filters the staged files and would skip content-only commits.
    - name: backend-tests
      glob:
        - "source/backend/*"
        - "source/backend/**/*"
        - "content/*"
        - "content/**/*"
      run: cd source/backend && dotnet test PolskiStreamerSimulator.slnx --filter-not-trait "Category=Integration"
